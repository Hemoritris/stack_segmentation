[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "box-perception"
version = "0.1.0"
description = "基于固定挂顶 RGB-D 相机的箱体 4DoF 位姿估计与垛堆增量建模"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "han" }]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "opencv-python>=4.5",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
vision = [
    "ultralytics>=8.2",
    "pyrealsense2>=2.54",
]
viz = [
    "open3d>=0.18",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
box-perception = "box_perception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
