# Passed directly to realsense2_camera through rs_launch.py config_file.
enable_infra: false
rgb_camera.global_time_enabled: true
color_qos: SENSOR_DATA
depth_qos: SENSOR_DATA
# L515 firmware 1.5.4.1 fails an XU control when hardware stream sync is forced.
# The align filter and the Python timestamp matcher do not require that mode.
enable_sync: false
